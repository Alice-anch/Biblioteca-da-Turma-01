<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Biblioteca da Turma</title>
    <link rel="stylesheet" href="/css/taskflow.css" />
  </head>
  <body>
    <header class="cabecalho">
      <div>
        <h1 class="cabecalho__titulo" id="nome-do-sistema">Biblioteca da Turma</h1>
        <p class="cabecalho__subtitulo">
          <span id="versao">v0.5.0</span> • <span id="data-de-hoje"></span>
        </p>
      </div>
      <div class="cabecalho__acoes">
        <span id="usuario-nome"></span>
        <button id="botao-sair" class="botao botao--pequeno" type="button" hidden>
          Sair
        </button>
      </div>
    </header>

    <!-- TELA DE ENTRADA (Login e Criar Conta) -->
    <section id="tela-entrada" class="entrada">
      <form class="formulario" id="form-entrar">
        <h2>Entrar</h2>
        <div class="campo">
          <label class="campo__rotulo" for="entrar-email">E-mail</label>
          <input class="campo__entrada" id="entrar-email" type="email" required />
        </div>
        <div class="campo">
          <label class="campo__rotulo" for="entrar-senha">Senha</label>
          <input class="campo__entrada" id="entrar-senha" type="password" required />
        </div>
        <button class="botao botao--primario" type="submit">Entrar</button>
      </form>

      <form class="formulario" id="form-criar" hidden>
        <h2>Criar conta</h2>
        <div class="campo">
          <label class="campo__rotulo" for="criar-nome">Nome</label>
          <input class="campo__entrada" id="criar-nome" type="text" required />
        </div>
        <div class="campo">
          <label class="campo__rotulo" for="criar-email">E-mail</label>
          <input class="campo__entrada" id="criar-email" type="email" required />
        </div>
        <div class="campo">
          <label class="campo__rotulo" for="criar-senha">Senha (6 caracteres ou mais)</label>
          <input class="campo__entrada" id="criar-senha" type="password" required />
        </div>
        <button class="botao botao--primario" type="submit">Criar conta</button>
      </form>

      <button class="botao botao--pequeno" id="alternar-entrada" type="button">
        Ainda não tenho conta
      </button>
      <p class="campo__erro" id="erro-entrada" role="alert"></p>
    </section>

    <!-- TELA PRINCIPAL DO SISTEMA -->
    <main id="tela-app" hidden>
      <ul class="estatisticas">
        <li class="estatistica">
          <span class="estatistica__numero" id="total">0</span>
          <span class="estatistica__rotulo">Total de livros</span>
        </li>
        <li class="estatistica">
          <span class="estatistica__numero" id="pendentes">0</span>
          <span class="estatistica__rotulo">Atrasados</span>
        </li>
      </ul>

      <p class="aviso" id="comece-por" hidden></p>

      <form class="formulario" id="formulario">
        <div class="campo">
          <label class="campo__rotulo" for="titulo">Título do livro</label>
          <input class="campo__entrada" id="titulo" type="text" />
        </div>
        <div class="campo">
          <label class="campo__rotulo" for="genero">Gênero</label>
          <select class="campo__selecao" id="genero">
            <option value="tecnico">Técnico</option>
            <option value="ficcao">Ficção</option>
            <option value="fantasia">Fantasia</option>
            <option value="biografia">Biografia</option>
          </select>
        </div>
        <button class="botao botao--primario" type="submit">Cadastrar</button>
      </form>

      <p class="campo__erro" id="erro" role="alert"></p>

      <ul class="lista" id="lista"></ul>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
